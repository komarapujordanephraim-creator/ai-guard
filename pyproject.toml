[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-guard"
version = "0.1.0"
description = "Test LLM apps for prompt injection, data leakage and unsafe actions."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Komarapu Jordan Ephraim"}]

[project.scripts]
ai-guard = "aiguard.cli:main"

[tool.setuptools]
packages = ["aiguard"]
